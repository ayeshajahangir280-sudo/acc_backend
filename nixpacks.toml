# Django 6.x requires Python >= 3.12 (Nixpacks defaults to an older version).
[variables]
NIXPACKS_PYTHON_VERSION = "3.12"
PYTHONUNBUFFERED = "1"

[start]
cmd = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --access-logfile - --error-logfile -"
